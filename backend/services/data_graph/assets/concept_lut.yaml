# concept_lut.yaml — high-level concepts (v3)
#
# Source of truth for user-trait concepts + update rules in Chalie's data_graph.
# Regenerate sqlite artifact with: python -m utils.generate_concept_lut
#
# v3 restructure (2026-04-16):
#   Radical simplification from 149 fine-grained concepts to 27 high-level ones.
#   Calibration on v2 showed 134/488 (27%) aliases routed to the wrong canonical
#   — surface-form token overlap (step_*, _preference suffix, current_ prefix,
#   employment_* prefix, "phone"/"name" tokens) dominated the embedding signal
#   at the canonical_key granularity. gte-modernbert cannot discriminate between
#   `job_title` and `job_location` — they look like the same concept to it.
#
#   Fix: collapse to ~27 semantically distant canonical keys. The VALUE carries
#   the detail ("job_title: senior engineer" stored under `employment`). Aliases
#   are now embedded as additional lookup labels alongside the canonical_key, each
#   row pointing back to the same canonical_key + rule.  This is necessary because
#   cosine similarity of e.g. "birthday" vs "birth_date" under gte-modernbert falls
#   below the 0.80 LUT threshold, causing canonicalization misses at runtime.
#
# Rules:
#   temporal   - new value replaces old; most recent wins. Supersede + edge.
#                History preserved via active=0 rows + superseded_by edges.
#   coexist    - multiple values simultaneously true. All stored, nothing superseded.
#   immutable  - should never change. If a contradiction arrives, flag for review
#                rather than silently overwriting.

version: 3

concepts:

  # ─────────────────────────────────────────────────────────────────────
  # Immutable — facts that don't change across a lifetime
  # ─────────────────────────────────────────────────────────────────────

  - canonical_key: birth_date
    rule: immutable
    aliases:
      - date_of_birth
      - dob
      - birthday
      - born_on
      - birth_day

  - canonical_key: birth_place
    rule: immutable
    aliases:
      - place_of_birth
      - birthplace
      - born_in
      - hometown_of_origin
      - where_born

  - canonical_key: biological_parents
