id: ubiquiti
name: Ubiquiti
version: 1.0.0
entry_class: UbiquitiCapability
description: Control and monitor UniFi network devices, clients, and WiFi networks.
providers:
  - local
fields:
  - name: url
    label: UniFi Controller URL
    type: text
    placeholder: "https://192.168.1.1"
    required: true
  - name: username
    label: Username
    type: text
    required: true
  - name: password
    label: Password
    type: password
    required: true
  - name: site
    label: Site Name
    type: text
    placeholder: "default"
    default: "default"
    required: false
  - name: verify_ssl
    label: Verify SSL
    type: checkbox
    default: false
