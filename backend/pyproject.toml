[project]
name = "chalie"
version = "1.0.0-beta"
description = "A personal intelligence layer"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.32.5",
    "sqlite-vec>=0.1.9",
    "flask-sock>=0.7.0",
    "transformers>=4.48.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    # numpy upper bound: numba 0.65.x metadata caps numpy<2.5; exceeding it
    # breaks the UMAP→HDBSCAN clustering stack below at import time.
    "numpy>=1.24,<2.5",
    # Episodic hierarchy roll-up clustering (episodic_service.find_super_candidates):
    # L2-normalise → UMAP reduce → sklearn HDBSCAN density clustering. UMAP is the
    # only reducer that yields usable clusters at our embedding scale — raw 768-d
    # HDBSCAN collapses to one blob and PCA degenerates at every component count.
    # sklearn ships HDBSCAN built-in; scipy/numba/llvmlite are UMAP's compiled deps.
    "scikit-learn>=1.7",
    "scipy>=1.11",
    "umap-learn>=0.5.5",
    "numba>=0.59",
    "llvmlite>=0.42",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "trafilatura>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    # onnx (the format library) and the onnxruntime CPU runtime are both direct
    # base deps. embeddings, the classifier heads and rapidocr all need a working
    # runtime. The CPU wheel is the sole variant — no GPU/ROCm alternatives.
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "rapidocr_onnxruntime>=1.4.0",
    "ddgs>=0.1.0",
    "RestrictedPython>=7.3",
    "cryptography>=43.0.0",
    # Snapshot Time-Machine zips: pyzipper writes/reads WZ-AES-256 archives and
    # rides on pycryptodomex (the Cryptodome namespace) for the cipher.
    "pyzipper>=0.4.0",
    "pycryptodomex>=3.20.0",
    "playwright>=1.40.0",
    "imapclient>=3.0.0",
    "caldav>=1.3.0",
    "icalendar>=5.0.0",
    "PyYAML>=6.0",
    "vobject>=0.9.7",
    "nltk>=3.8",
    "feedparser>=6.0.0",
    "nh3>=0.2.0",
    "rapidfuzz>=3.0.0",
    "mcp>=1.24.0",
    "uvicorn>=0.34.0",
    "geopy>=2.4.0",
    # Natural-language due_at parsing for the schedule ability ("tomorrow 9am",
    # "in 2 hours") resolved in the user's timezone.
    "dateparser>=1.3.0",
    "pytest>=8.0.0",
    # mypy gates the ToolResult return-type contract on the abilities package
    # (see tests/test_ability_returns_tool_result.py) — it runs inside the unit
    # suite, so it must be present wherever the gate runs.
    "mypy>=1.8.0",
]

[project.optional-dependencies]
voice = [
    "kokoro-onnx>=0.5.0",
    "useful-moonshine-onnx>=20251121",
    "soundfile>=0.13.0",
    "numpy>=1.24.0",
    "silero-vad-lite>=0.2.1",
    "noisereduce>=3.0.3",
]

[tool.mypy]
# Global strict mode, no exceptions. The whole backend — every first-party
# package plus the test suite and top-level modules — type-checks clean under
# `mypy --strict`. There is deliberately no relax/override block: any new code
# is held to the same bar from the start. See docs/typing-ratchet.md for the
# history of how the codebase was migrated to this state and how the gate works.
strict = true
follow_imports = "silent"
ignore_missing_imports = true
# `--strict` does NOT imply these; we enable them explicitly so the bar is
# closer to a hard-typed language. strict_bytes forbids the implicit
# str/bytes/bytearray promiscuity mypy otherwise tolerates.
strict_bytes = true

[tool.setuptools]
# backend/ is not an importable package — it's run directly via run.py.
# This config prevents setuptools from scanning for packages; pyproject.toml
# is used purely as a dependency manifest.
packages = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
