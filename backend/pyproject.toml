[project]
name = "chalie"
version = "1.3.1-beta"
description = "A personal intelligence layer"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.32.5",
    "sqlite-vec>=0.1.9",
    "flask-sock>=0.7.0",
    "transformers>=4.48.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-restx>=1.3.0",
    # numpy: kept pinned <2.5 conservatively — transformers/onnxruntime compatibility with numpy 2.5+ is unverified.
    "numpy>=1.24,<2.5",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "trafilatura>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    # onnx (the format library) and the onnxruntime CPU runtime are both direct
    # base deps — CPU-only, one runtime wheel for every consumer. embeddings, the classifier
    # heads, rapidocr, and voice (TTS/STT/VAD, below) all run through this one
    # wheel via the shared session factory (services/onnx_session.py), pinned
    # explicitly rather than leaned on as a transitive pull — that left it
    # absent on some images, which hung /ready on the 'Waking up Chalie' splash.
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "rapidocr_onnxruntime>=1.4.0",
    # Voice (TTS/STT): downloaded models live in resources/voice-models/,
    # fetched once at install time (installer/install.sh / the Docker build).
    # VAD runs the bundled silero_vad.onnx through the onnxruntime wheel above
    # (services/silero_vad_service.py) rather than a separate pip package.
    "kokoro-onnx>=0.5.0",
    "useful-moonshine-onnx>=20251121",
    "soundfile>=0.13.0",
    "noisereduce>=3.0.3",
    "ddgs>=0.1.0",
    "cryptography>=43.0.0",
    # Snapshot Time-Machine zips: pyzipper writes/reads WZ-AES-256 archives and
    # rides on pycryptodomex (the Cryptodome namespace) for the cipher.
    "pyzipper>=0.4.0",
    "pycryptodomex>=3.20.0",
    "playwright>=1.40.0",
    "imapclient>=3.0.0",
    "caldav>=1.3.0",
    "icalendar>=5.0.0",
    "PyYAML>=6.0",
    "vobject>=0.9.7",
    "feedparser>=6.0.0",
    "nh3>=0.2.0",
    # DTO boundary layer (backend/api/dto/): validates inbound requests and
    # serializes outbound responses on a single typed contract.
    "pydantic>=2.6",
    "rapidfuzz>=3.0.0",
    # mcp: bounded below the next major. 2.0 renamed the server class
    # (FastMCP→MCPServer), the client transport (streamablehttp_client→
    # streamable_http_client, now 2-tuple + http_client=), and camelCase result
    # fields → snake_case. An unbounded constraint let a fresh (unpinned) install
    # auto-resolve to that breaking major the day it landed on PyPI. Bump the
    # ceiling only alongside a matching port.
    "mcp>=2.0.0,<3.0.0",
    "uvicorn>=0.34.0",
    "geopy>=2.4.0",
    # Natural-language due_at parsing for the schedule ability ("tomorrow 9am",
    # "in 2 hours") resolved in the user's timezone.
    "dateparser>=1.3.0",
    # Runtime PEP 696 (TypeVar defaults) on Python 3.11: the generic Ability[B]
    # base (abilities/_ability.py) types run()'s input during the ParamBag
    # migration. Declared explicitly rather than leaned on as a transitive pull.
    "typing-extensions>=4.4.0",
    "pytest>=8.0.0",
    # mypy gates the ToolResult return-type contract on the abilities package
    # (see tests/test_ability_returns_tool_result.py) — it runs inside the unit
    # suite, so it must be present wherever the gate runs.
    "mypy>=1.8.0",
    # watchdog provides FSEvents (macOS) and inotify (Linux) file-change events
    # for the FileIndexService daemon (backend/workers/file_index_worker.py).
    "watchdog>=4.0.0",
]

[tool.mypy]
# Global strict mode, no exceptions. The whole backend — every first-party
# package plus the test suite and top-level modules — type-checks clean under
# `mypy --strict`. There is deliberately no relax/override block: any new code
# is held to the same bar from the start; tests/test_static_typing_gate.py
# enforces it (plus bans on `# type: ignore` and explicit `Any`).
strict = true
follow_imports = "silent"
ignore_missing_imports = true
# `--strict` does NOT imply these; we enable them explicitly so the bar is
# closer to a hard-typed language. strict_bytes forbids the implicit
# str/bytes/bytearray promiscuity mypy otherwise tolerates.
strict_bytes = true
# Local type stubs for untyped third-party deps. flask_restx ships no py.typed,
# so without this mypy treats Resource/Namespace/Api as Any — which then trips
# `disallow_subclassing_any` and `disallow_untyped_decorators` on every API
# module. The stubs file is .pyi (not .py), so the no-Any/no-# type: ignore gates
# (which walk .py only) don't apply to it.
mypy_path = "stubs"

[tool.setuptools]
# backend/ is not an importable package — it's run directly via run.py.
# This config prevents setuptools from scanning for packages; pyproject.toml
# is used purely as a dependency manifest.
packages = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
