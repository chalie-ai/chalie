---
title: Social Media Strategy
use_for: build or audit a social media strategy — platform selection, content pillars, posting cadence, and 90-day growth plan
tags: marketing, social media, strategy, LinkedIn, Twitter, Instagram, content calendar
version: 1
---

1. Use `memory` to recall any stored platform or brand context, then ask which platforms the user is active on, current posting frequency, and what is working or not.
2. Use `memory` to recall any stored goals or success criteria, then ask the primary goal (brand awareness, lead generation, community building, or thought leadership) and what success looks like in 90 days.
3. Use `memory` to recall any existing brand voice, ICP, or audience information.
4. Use the `search` tool to research where the target audience is most active and what content performs in this niche.
5. Use `document` to recommend 1–2 platforms to focus on based on audience-platform fit, with rationale for each choice.
6. Use `document` to define 3–5 content pillars with a suggested mix: 40% educational, 20% behind-the-scenes, 15% social proof, 15% engagement, 10% promotional.
7. Use `document` to provide a weekly content calendar template with pillar, format, and posting time per day.
8. Deliver a 90-day growth plan with key milestones, metrics to track (engagement rate, follower growth, click-through), and save the strategy to `memory`.
