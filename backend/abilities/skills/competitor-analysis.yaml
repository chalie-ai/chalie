---
title: Competitor Analysis Framework
use_for: structuring competitor analysis reports and market research
tags: research, analysis, strategy, competitors, market
version: 2
related_abilities: search, news, read, subagent, document
---

1. Use the `search` tool to find the top competitors in the vertical or industry the user described.
2. Use the `news` tool for each competitor to gather recent coverage — funding rounds, product launches, partnerships, and executive changes.
3. Use the `subagent(type=web_surfer)` tool to deep-crawl each competitor's website for pricing, feature lists, and positioning. Fire one subagent per competitor with `wait=false`.
4. Use the `subagent(type=summariser)` tool to compress each competitor's crawled content into a structured profile: product offering, target market, pricing model, key differentiators.
5. Build a SWOT matrix for each competitor comparing strengths, weaknesses, opportunities, and threats based on the gathered data.
6. Compare competitors side-by-side. Identify patterns, market gaps, and the user's unique advantages.
7. Use the `document` tool to save the complete analysis as a persistent document titled with the vertical and date.
8. Present the side-by-side comparison to the user with strategic recommendations and evidence from the data gathered.
