---
title: Knowledge Base Builder
use_for: read a set of URLs or documents and build a structured, searchable knowledge base saved as persistent documents
tags: knowledge-base, documentation, reading, archiving, reference, notes, organisation
version: 1
---

1. Ask the user what the knowledge base is for, what sources to include (URLs, topics to search, or pasted text), and how they want it organised; use `recall` to surface any existing structure.
2. Use `recall` to surface any existing knowledge base structure or related prior entries.
3. For each source URL, use `web_fetch` to extract the full content; use `browser` for JS-heavy or login-required pages.
4. Use `search` to discover additional sources on the topic if the user provided keywords rather than explicit URLs.
5. Use `write_file` to structure each entry: title, source URL, date retrieved, 3–5 key takeaways, and any notable quotes or data points.
6. Use `write_file` to organise the entries into the agreed structure and build an index document linking all entries.
7. Use `write_file` to save each entry and the index, then summarise what the knowledge base covers so it is remembered for quick future reference.
