---
title: International Expansion Planner
use_for: evaluating international markets, planning market entry, and building regional go-to-market strategy
tags: international expansion, market entry, localization, go-to-market, regional strategy, cross-border
version: 1
---

1. Use `recall` to surface any prior market research or expansion decisions already made.
2. Use `search` to gather data on each candidate market: addressable market size, competitive intensity, regulatory requirements, and local buying behavior.
3. Use `news` to surface recent market developments, competitor entries, and regulatory changes in the target regions.
4. Use `code_agent` to score each candidate market across six factors: market size, competitive intensity, regulatory complexity, cultural distance, existing traction, and operational complexity.
5. Use `write_file` to recommend the entry mode for the top-scoring market — export, partnership, local team, or entity — with a rationale based on revenue opportunity versus investment required.
6. Use `write_file` to produce a localization checklist covering product, go-to-market, and operations dimensions for the recommended market.
7. Use `write_file` to save the market scoring matrix, recommended entry mode, and localization checklist.
8. Close with the expansion decision and its rationale so they are remembered for future reference.
