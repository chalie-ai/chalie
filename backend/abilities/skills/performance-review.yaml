---
title: Performance Review Writing
use_for: writing structured performance reviews for team members
tags: management, team, feedback, evaluation, work
version: 1
---

1. Use the `memory` tool to recall any stored information about the team member — role, past feedback, goals set in prior reviews.
2. Ask the user for the review period, the team member's role expectations, and 2-3 key projects to evaluate.
3. Use the `calendar` tool to check meeting frequency and 1:1 history with the team member during the review period.
4. Use the `email` tool to search for relevant feedback threads, project updates, or recognition mentioning the team member.
5. Structure the review into three sections: accomplishments with specific evidence, areas for growth with actionable suggestions, and goals for the next period with measurable targets.
6. Use the `document` tool to draft the review as a persistent document the user can revise.
7. Present the draft to the user and iterate on tone, emphasis, and rating calibration before finalising.
