---
title: SEO Site Audit
use_for: audit a website's SEO health — identify technical issues, on-page problems, and content gaps with a prioritized fix list
tags: SEO, audit, search, organic, technical SEO, on-page, keywords
version: 1
---

1. Use `memory` to recall any prior SEO context, then ask what type of site it is, what the primary SEO goal is, and what keywords or topics matter most.
2. Use `memory` to recall any stored traffic baselines, then ask about current organic traffic level, any known issues, and whether there have been recent site migrations or redesigns.
3. Use the `web_fetch` tool to fetch and inspect the site's homepage and key landing pages for title tags, meta descriptions, heading structure, and content quality.
4. Use the `search` tool to check how the site currently appears in search results for its target keywords.
5. Use the `search` tool to identify competitor pages that outrank the site on core topics and surface gap opportunities.
6. Use `write_file` to audit findings across three categories: Technical SEO (indexation, speed signals, mobile), On-Page SEO (title tags, meta descriptions, heading hierarchy, internal links), and Content (thin content, keyword gaps, topical authority).
7. Use `write_file` to record for each issue: what is wrong, the SEO impact level (High/Medium/Low), evidence found, and a specific fix recommendation.
8. Deliver a prioritized action plan grouped as: Critical fixes → High-impact improvements → Quick wins, then save the audit summary to `memory`.
