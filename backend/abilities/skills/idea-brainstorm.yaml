---
title: Idea Brainstorm
use_for: developing a rough idea into a well-formed plan or design through structured exploration, alternative generation, and collaborative refinement
tags: brainstorming, ideation, planning, design, decision making
version: 1
---

1. Use `memory` to recall any prior context, preferences, or related plans relevant to the topic.
2. Ask one focused question at a time to clarify the purpose, constraints, and success criteria — prefer multiple-choice when possible — then log requirements via `file_write`.
3. Use `search` to look up relevant background information, prior art, or examples that could inform the design.
4. Use `file_write` to generate six distinct approaches: three high-confidence options (well-understood, likely to work) and three diverse exploratory options (different regions of the solution space).
5. Present the approaches with trade-offs — lead with the recommended option and explain the reasoning behind that recommendation.
6. Once the preferred direction is chosen, use `file_write` to build out the design in sections of 200-300 words — check each section with the user before continuing.
7. Iterate based on feedback — use `file_write` to revise any section that needs clarification or adjustment.
8. Use `file_write` to save the validated design or plan as a persistent record, then store a concise summary in `memory`.
