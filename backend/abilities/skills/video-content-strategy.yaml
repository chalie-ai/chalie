---
title: Video Content Strategy
use_for: plan a video content strategy, write a video script, or build a YouTube or short-form video pipeline
tags: video, YouTube, content, strategy, script, TikTok, Reels, Shorts
version: 1
related_abilities: search, news, memory, document
---

1. Use `memory` to recall any prior video strategy, brand voice, or audience research stored for this user.
2. Ask whether the goal is a full video strategy, a script for a specific video, or repurposing existing content — identify the primary platform, goal, and target audience — then record in `document`.
3. Use `search` to identify competitor or benchmark channels, their top-performing topics, and format patterns in this niche.
4. Use `news` to surface any trending angles or recent developments relevant to the niche.
5. Use `document` to define 3–5 content pillars for the channel with a recommended mix of evergreen (SEO-driven), series, and trending-topic videos.
6. For a script request, use `document` to draft a full video script with hook (first 15 seconds), body sections, transitions, and a clear CTA — optimized for the platform's format and length.
7. For a repurposing request, use `document` to identify which moments from long-form content work as short clips, with cut points and caption suggestions.
8. Save the strategy or script outline to `memory` and finalize in `document` for continuity across sessions.
