---
title: Compliance Readiness Check
use_for: pressure-testing any compliance program before starting a new framework, planning an audit calendar, or preparing for certification stage 1
tags: compliance, SOC2, ISO27001, GDPR, audit prep, compliance readiness, certification, multi-framework
version: 1
---

1. Use `memory` to recall any prior compliance assessments, known gaps, or active certifications already documented.
2. Use `memory` to surface any stored framework selections, then identify all applicable compliance frameworks by asking about industry, customer requirements, and geography — flag any commonly missed overlays (NYDFS for financial services, HIPAA for healthcare, ISO 42001 for AI systems).
3. Use `document` to map overlaps between the identified frameworks — record where a single evidence artifact satisfies controls in multiple frameworks to reduce audit effort.
4. Use `document` to verify and record that every evidence artifact has a single accountable owner with a documented refresh cadence — shared ownership without accountability is the most common cause of stale evidence.
5. Use `calendar` to check the audit calendar: confirm surveillance audits are not stacking in the same window, auditor independence is maintained, and small teams have a rotation plan.
6. Use `search` to verify the current status of any relevant harmonized standards, regulatory deadlines, or framework updates that could affect scope.
7. Use `schedule` to note the management review cadence: recommend one quarterly cross-framework review covering all applicable frameworks rather than separate reviews per framework.
8. Use `document` to save a compliance readiness report with: frameworks in scope, evidence inventory gaps, ownership assignments, audit calendar, and prioritized remediation actions.
