---
title: Entity Research
use_for: build a comprehensive dossier on a person, company, or organisation from public sources
tags: research, person, company, dossier, due-diligence, background-check, organisation
version: 1
related_abilities: search, news, read, memory, document
---

1. Use `memory` to recall any prior notes on this entity or related organisations before gathering requirements.
2. Ask the user to name the entity, the purpose of the research (due diligence, partnership evaluation, competitive intelligence, or background research), and what they already believe or suspect — note these working hypotheses in `memory`.
3. Use `search` to find the entity's official web presence, LinkedIn profile (if a person), Crunchbase or Companies House profile (if an organisation), and any Wikipedia or Wikidata entry.
4. Use `read` to extract structured details from the most authoritative sources found — role/title, founding date/history, key people, products/services, funding or financials (if public).
5. Use `news` to find recent coverage: announcements, controversies, leadership changes, funding rounds, or product launches in the past 90 days.
6. Use `search` to find any independent reviews, forum discussions, or third-party assessments (Glassdoor for companies, academic profiles for researchers, etc.).
7. Use `document` to compile the dossier, explicitly confirming or refuting each of the user's working hypotheses, plus any open questions not confirmed from public sources.
8. Use `memory` to store a concise summary of findings for future reference.
