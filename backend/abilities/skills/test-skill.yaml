## Competitor Analysis Framework

### Step 1: Define the Competitive Landscape
Identify 3–5 direct competitors and 2–3 indirect competitors. Use search and news tools to gather current information.

### Step 2: Gather Data Points
For each competitor, collect:
- Product/service offerings and pricing
- Market positioning and target audience
- Recent news, funding, partnerships
- Strengths and weaknesses (public perception)

### Step 3: Organize into a SWOT Matrix
Create a SWOT analysis for each competitor:
- **Strengths**: What they do well
- **Weaknesses**: Where they fall short
- **Opportunities**: Market gaps they haven't filled
- **Threats**: What they could do that impacts you

### Step 4: Synthesize Findings
Compare competitors side-by-side. Identify patterns, gaps, and your unique advantages. Present findings with evidence from the data gathered.
