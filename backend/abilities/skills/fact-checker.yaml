---
title: Fact Checker
use_for: verify specific factual claims in text against authoritative sources and produce a correction report
tags: fact-check, verification, accuracy, claims, corrections, sources
version: 1
related_abilities: search, read, news, document
---

1. Ask the user to paste the text (or specific claims) to be verified, and clarify the domain: AI model specs, technical docs, statistics, general facts, or other; use `memory` to recall any prior checks on this topic.
2. Use `document` to extract and list each discrete, verifiable claim as a numbered list — skip subjective or opinion-based statements.
3. For each claim, use `search` to find the most authoritative primary source (official docs, publisher sites, academic papers, registries).
4. Use `read` to extract the relevant content from each authoritative source URL found.
5. Use `news` to find any recent updates or corrections that may have superseded the original claim.
6. Use `document` to record each verdict (Verified / Outdated / Inaccurate / Unverifiable), the corrected value where applicable, and the source URL with retrieval date.
7. Use `document` to present a correction report: numbered list of claims with verdict, evidence, corrected wording, and source — flag anything unverifiable with "no authoritative source found."
8. Ask the user to confirm before applying corrections to their original text, then use `document` to save the corrected version.
