---
title: Strategic Alignment Check
use_for: detecting misalignment between company goals and team execution, cascading strategy from board to IC level
tags: strategic alignment, OKR alignment, strategy cascade, silos, conflicting goals, goal cascade
version: 1
---

1. Use `recall` to surface the company's current stated strategic priorities and any prior alignment assessments.
2. Use `recall` to surface stored OKRs or priorities, then ask the user to state the company's single most important strategic priority in one sentence — if it takes a paragraph, flag that the strategy is not clear enough to cascade.
3. Use `write_file` to map the goal cascade: company OKRs down to department OKRs down to team OKRs, identifying which company goal each lower-level goal is meant to support.
4. Use `write_file` to detect orphan goals (team goals with no parent company OKR), conflicting goals (two teams' goals that produce worse outcomes when both succeed), and coverage gaps (company OKRs with no team owning them).
5. Use `write_file` to produce an alignment report listing all detected orphans, conflicts, and gaps with recommended fixes.
6. Use `write_file` to recommend explicit ownership assignments for any unowned company OKRs.
7. Use `write_file` to save the cascade map and alignment report.
8. Close with the alignment findings so they are remembered for the next planning cycle.
