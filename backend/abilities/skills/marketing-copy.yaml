---
title: Marketing Copy
use_for: write conversion-focused marketing copy — landing pages, ad copy, product descriptions, or taglines
tags: marketing, copywriting, landing-page, ads, conversion, writing, product
version: 1
---

1. Use `memory` to recall any existing brand voice, prior copy, or ICP notes on file before gathering requirements.
2. Ask what the copy is for (landing page hero, ad copy, product description, email subject lines, or taglines), who the target audience is, their primary pain point, and the single most important outcome the product delivers — then record via `write_file`.
3. Use `search` to study 3–5 competitors' landing pages or ads for the same category — note the hooks, benefit statements, and CTAs they lead with.
4. Use `write_file` to identify the primary message hierarchy: headline claim → key benefit → social proof hook → CTA — based on the pain point and product outcome.
5. Use `write_file` to draft 3 headline variations using different persuasion frames: outcome ("Get X in Y time"), problem-relief ("Stop doing Z"), or authority ("The only tool that X").
6. Write the full copy asset(s) via `write_file` — body copy, subheadings, bullet benefits, and CTA button text — with one complete version and one shorter punchy alternative.
7. Annotate each variant via `write_file` with the copywriting principle it applies (e.g. Cialdini social proof, Jobs-to-be-done framing, PAS structure).
8. Use `write_file` to save the final annotated copy so it can be iterated on across sessions.
