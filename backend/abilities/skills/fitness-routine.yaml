---
title: Fitness Routine Builder
use_for: designing personalised workout routines and exercise plans
tags: fitness, exercise, health, workout, training
version: 1
---

1. Use the `recall` tool to surface any stored fitness goals, injuries, medical considerations, or available equipment.
2. Ask the user for their current fitness level, available time per session, training days per week, and primary goal — strength, endurance, flexibility, or weight management.
3. Use the `search` tool to find evidence-based exercise recommendations matching the user's goals and experience level.
4. Design a weekly routine with specific exercises, sets, reps, rest periods, and progression plan. Alternate muscle groups to allow recovery.
5. Use the `schedule` tool to set workout reminders on the chosen training days at the user's preferred time.
6. Use the `list` tool to create an equipment checklist if home or gym equipment is needed.
7. Use the `write_file` tool to save the routine as a persistent reference with progression milestones.
8. Present the plan to the user with warm-up and cool-down recommendations for each session.
