---
title: Concise Writing
use_for: improving clarity and strength of any writing — emails, documents, messages, or notes — by applying established editing principles
tags: writing, editing, clarity, communication, concise, style
version: 1
---

1. Use `memory` to recall any known writing preferences or past style guidance for the user.
2. Use `read` to load the text if it is at a URL or file path, then identify its purpose and intended audience.
3. Apply active voice and positive form throughout: rewrite passive constructions and replace negatives ("not clear") with direct assertions ("unclear") — capture the revised draft in `document`.
4. Use definite, specific, concrete language: replace vague phrases with precise words and cut filler, redundancy, and throat-clearing — update `document` with each pass.
5. Keep related words together and place emphatic words at sentence endings for maximum impact — note changes inline in `document`.
6. Ensure each paragraph covers one topic and opens with a clear topic sentence — restructure in `document` where needed.
7. Present the revised text to the user with a brief note on key changes, then ask if further refinement is needed via `document`.
8. Use `document` to save the final version if the user wants to keep it.
