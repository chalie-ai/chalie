name: Create Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger n8n release workflow
        env:
          N8N_RELEASE_WEBHOOK_URL: ${{ secrets.N8N_RELEASE_WEBHOOK_URL }}
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "$N8N_RELEASE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ github.ref_name }}\"}"
