name: Update build log

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-log
  cancel-in-progress: true

jobs:
  check-permission:
    runs-on: ubuntu-latest
    outputs:
      is_maintainer: ${{ steps.check.outputs.is_maintainer }}
    steps:
      - name: Check if actor is a maintainer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then
            echo "is_maintainer=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_maintainer=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${{ github.actor }} has '$PERM' permission (need maintain or admin)"
          fi

  trigger-build-log:
    needs: check-permission
    if: needs.check-permission.outputs.is_maintainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger n8n build log workflow
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": \"${{ github.ref_name }}\"}"
