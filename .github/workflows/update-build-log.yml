name: Update build log

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-log
  cancel-in-progress: true

jobs:
  check-permission:
    runs-on: ubuntu-latest
    outputs:
      is_maintainer: ${{ steps.check.outputs.is_maintainer }}
    steps:
      - name: Check if actor is a maintainer
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then
            echo "is_maintainer=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_maintainer=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${{ github.actor }} has '$PERM' permission (need maintain or admin)"
          fi

  update-build-log:
    needs: check-permission
    if: needs.check-permission.outputs.is_maintainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Chalie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for git log

      - name: Checkout chalie-web
        uses: actions/checkout@v4
        with:
          repository: chalie-ai/chalie-web
          token: ${{ secrets.CHALIE_WEB_TOKEN }}
          path: chalie-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build log updater
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
        run: node scripts/update-build-log.js

      - name: Commit and push
        working-directory: chalie-web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/build-log/ src/build-log/.state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(build-log): update $(date -u +%Y-%m-%d)"
            git push origin main
          else
            echo "No changes to commit"
          fi
