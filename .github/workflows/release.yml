name: Publish Installer

on:
  push:
    tags: ['v*.*.*']

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      installer_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout Chalie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if installer changed since last tag
        id: diff
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$PREV_TAG" HEAD -- installer/install.sh | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "installer/install.sh unchanged since $PREV_TAG — skipping publish"
          fi

  publish:
    needs: check-changes
    if: needs.check-changes.outputs.installer_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chalie
        uses: actions/checkout@v4

      - name: Checkout chalie-web
        uses: actions/checkout@v4
        with:
          repository: dylangrech92/chalie-web
          path: chalie-web
          token: ${{ secrets.CHALIE_WEB_TOKEN }}

      - name: Update installer
        run: cp installer/install.sh chalie-web/public/install

      - name: Push to chalie-web
        working-directory: chalie-web
        run: |
          git config user.email "bot@chalie.ai"
          git config user.name "Chalie Release Bot"
          git add public/install
          if ! git diff --cached --quiet; then
            git commit -m "chore: installer updated for ${{ github.ref_name }}"
            git push
          else
            echo "No changes to commit"
          fi

  # Publish a SHA256 sidecar of the release source tarball so install.sh can
  # verify the archive it downloads (issue #1910). GitHub source archives are
  # byte-deterministic, so the checksum computed at release time matches the
  # archive install.sh fetches from refs/tags/<tag>.tar.gz.
  publish-checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and checksum the release tarball
        run: |
          TAG="${{ github.ref_name }}"
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz" -o "chalie-${TAG}.tar.gz"
          sha256sum "chalie-${TAG}.tar.gz" | awk '{print $1"  chalie-'${TAG}'.tar.gz"}' > "chalie-${TAG}.tar.gz.sha256"

      - name: Upload checksum sidecar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: chalie-*.tar.gz.sha256
