name: Publish Docker Image

on:
  push:
    tags: ['v*.*.*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chalieai/chalie:${{ github.ref_name }}
            chalieai/chalie:latest
          # Pass the tag into the build so install.sh fetches the
          # refs/tags/<tag>.tar.gz directly. Without this it falls back to the
          # GitHub releases API for "latest", which races with the separate
          # release-publication workflow that runs on the same tag push.
          build-args: |
            TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
