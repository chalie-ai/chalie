name: Publish Docker Image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chalieai/chalie:${{ github.ref_name }}
            chalieai/chalie:latest
          # Pass the tag into the build so install.sh fetches the
          # refs/tags/<tag>.tar.gz directly. Without this it falls back to the
          # GitHub releases API for "latest", which races with the separate
          # release-publication workflow that runs on the same tag push.
          build-args: |
            TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
