name: Publish Docker Image

on:
  push:
    tags: ['v*.*.*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chalieai/chalie:${{ github.ref_name }}
            chalieai/chalie:latest
          # Pass the tag into the build so install.sh fetches the
          # refs/tags/<tag>.tar.gz directly. Without this it falls back to the
          # GitHub releases API for "latest", which races with the separate
          # release-publication workflow that runs on the same tag push.
          build-args: |
            TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
