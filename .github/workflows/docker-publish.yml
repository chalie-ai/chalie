name: Publish Docker Image

on:
  push:
    tags: ['v*.*.*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chalieai/chalie:${{ github.ref_name }}
            chalieai/chalie:latest
          # Pass the tag into the build so install.sh fetches the
          # refs/tags/<tag>.tar.gz directly. Without this it falls back to the
          # GitHub releases API for "latest", which races with the separate
          # release-publication workflow that runs on the same tag push.
          build-args: |
            TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
