<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chalie — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="icon" type="image/png" href="/icons/icon.png">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
    }
    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    .login-card p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .login-card label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }
    .login-card input {
      display: block;
      width: 100%;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus {
      border-color: var(--accent-primary);
    }
    .login-card button[type="submit"] {
      width: 100%;
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-card button[type="submit"]:hover { opacity: 0.85; }
    .login-card button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Sign in to continue to Chalie.</p>

    <form id="loginForm" method="post" action="/auth/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <input type="hidden" id="next" name="next" value="/">

      <button type="submit" id="submitBtn">Sign in</button>
      <div id="error" class="login-error"></div>
    </form>
  </div>

  <script>
    // Populate ?next= from URL params
    const nextUrl = new URLSearchParams(window.location.search).get('next');
    if (nextUrl && nextUrl.startsWith('/')) {
      document.getElementById('next').value = nextUrl;
    }

    // Progressive enhancement: submit via fetch so we stay on the page on error,
    // but fall back to native form POST if JS fails (Keychain still saves).
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        errorEl.textContent = 'Username and password required.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          // Redirect to next (or home)
          const dest = document.getElementById('next').value || '/';
          window.location.replace(dest);
        } else {
          errorEl.textContent = res.status === 401 ? 'Invalid credentials.' : 'Login failed.';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        errorEl.textContent = 'Network error.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
