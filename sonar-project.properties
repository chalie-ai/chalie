sonar.projectKey=chalie-ai_chalie
sonar.organization=chalie-ai

sonar.sources=backend,frontend
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.pyc,**/dist/**
sonar.test.inclusions=backend/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# schema.sql is raw SQLite DDL — SQL has no constant mechanism.
# content_rowid='rowid' must be repeated verbatim in every FTS5 virtual table
# declaration. S1192 (duplicate string literal) is a false positive here.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/schema.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/schema.sql

# Project convention: always prefix injected globals with window.* for
# explicit scoping — keeps the linter from flagging them as undeclared.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/**/*.js
