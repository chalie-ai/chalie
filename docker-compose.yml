services:
  # Dylan's instance (port 8081)
  # Mounts live code for hot-reload
  chalie-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalie-dev
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./run.sh:/app/run.sh
      - chalie_dev_data:/data
    environment:
      - CHALIE_DB_PATH=/data/chalie.db
    command: bash run.sh --port=8081 --host=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Second user instance (port 8083)
  # Same code, separate database/storage
  chalie-user2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalie-user2
    ports:
      - "8083:8081"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./run.sh:/app/run.sh
      - chalie_user2_data:/data
    environment:
      - CHALIE_DB_PATH=/data/chalie.db
    command: bash run.sh --port=8081 --host=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Third user instance (port 8084)
  # Same code, separate database/storage
  chalie-user3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalie-user3
    ports:
      - "8084:8081"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./run.sh:/app/run.sh
      - chalie_user3_data:/data
    environment:
      - CHALIE_DB_PATH=/data/chalie.db
    command: bash run.sh --port=8081 --host=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chalie_dev_data:
    driver: local
  chalie_user2_data:
    driver: local
  chalie_user3_data:
    driver: local
